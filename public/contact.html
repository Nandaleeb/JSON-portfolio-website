<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer" />
</head>
<body>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/portfolio.html">Portfolio</a>
    <a href="/contact.html">Contact</a>
  </nav>
  <header>
    <h1>Contact Me</h1>
  </header>
  <section>
    <form id="contact-form" class="themed-form">
      <div class="input-group">
        <label for="name"><i class="fas fa-user"></i> Name</label>
        <input type="text" id="name" name="name" required placeholder="Your Name">
      </div>
      <div class="input-group">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="email" name="email" required placeholder="you@email.com">
      </div>
      <div class="input-group">
        <label for="message"><i class="fas fa-comment-dots"></i> Message</label>
        <textarea id="message" name="message" required placeholder="Type your message..."></textarea>
      </div>
      <div class="input-group">
        <label for="contact-method"><i class="fas fa-phone"></i> Preferred Contact Method</label>
        <select id="contact-method" name="contact-method">
          <option value="email">Email</option>
          <option value="phone">Phone</option>
          <option value="linkedin">LinkedIn</option>
        </select>
      </div>
      <div class="input-group">
        <label><input type="checkbox" name="subscribe" id="subscribe"> <i class="fas fa-bell"></i> Subscribe to updates</label>
      </div>
      <button type="submit"><i class="fas fa-paper-plane"></i> Send</button>
    </form>
    <div id="form-status"></div>
    <div class="contact-extra">
      <h3><i class="fas fa-info-circle"></i> Other ways to reach me:</h3>
      <ul>
        <li><i class="fab fa-whatsapp"></i> WhatsApp:<a href="https://wa.me/1234567890" target="_blank" rel="noopener">Chat now</a></li>
        <li><i class="fab fa-telegram"></i> Telegram: <a href="https://t.me/yourusername" target="_blank" rel="noopener">Message me</a></li>
        <li><i class="fas fa-map-marker-alt"></i> Location: Belmont, Massachussetts US</li>
      </ul>
    </div>
  </section>
  <footer>
    <div class="footer-content">
      <span>&copy; 2026 Noshi Andaleeb. All rights reserved.</span>
      <div class="footer-social">
        <a href="https://github.com/yourprofile" target="_blank" rel="noopener" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://linkedin.com/in/yourprofile" target="_blank" rel="noopener" aria-label="LinkedIn">
          <i class="fab fa-linkedin"></i>
        </a>
        <a href="mailto:your@email.com" aria-label="Email">
          <i class="fas fa-envelope"></i>
        </a>
      </div>
    </div>
  </footer>
  <script src="/contact.js"></script>
</body>
</html>
